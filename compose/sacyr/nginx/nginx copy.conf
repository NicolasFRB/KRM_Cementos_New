upstream krmtool {
    server django:8000;
}

server {
    listen 443 ssl;
    server_name cstool.sacyr.com;

    client_max_body_size 50M;

    ssl_certificate         /certs/cstool.sacyr.com.crt;
    ssl_certificate_key     /certs/cstool.sacyr.com.key;
    ssl_protocols           TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers             HIGH:!aNULL:!MD5;

    location /media/ {
        alias   /krm-media/;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        if (!-f $request_filename) {
            proxy_pass http://krmtool;
            break;
        }
    }
}

server {
        listen 80;
        return 301 https://cstool.sacyr.com$request_uri;
}
