apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: krm-kpmg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresdb
  template:
    metadata:
      labels:
        app: postgresdb
    spec:
      containers:
        - name: postgresdb
          image: postgres:14.6
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef: 
                name: db-secret-credentials
          volumeMounts:
            - mountPath: /var/lib/postgres/data
              name: db-data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: postgres-pvc