# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image registry
image:
  registry: ""

# Recursos asignados al contenedfor
container:
  port: 8000
  replicaCount: 1
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 1
      memory: 500Mi
  image:
    pullPolicy: IfNotPresent #Always
  deployment:
    strategy: Rolling
  probes:
    port: 8000
    ready:
      path: /ht/startup-probe/
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
    live:
      path: /ht/liveness-probe/
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5

# Service svc
service:
  application:
    type: LoadBalancer
    sessionAffinity: None
  # management:
  #   type: ClusterIP
  #   sessionAffinity: None

