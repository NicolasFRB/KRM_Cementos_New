version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_selfsigned
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certs:/etc/nginx/certs
      - ./html:/usr/share/nginx/html
      - ./generate.sh:/generate.sh
    ports:
      - "80:80"
      - "443:443"
    entrypoint: "/bin/bash -c '/generate.sh && nginx -g \"daemon off;\"'"
    restart: always
