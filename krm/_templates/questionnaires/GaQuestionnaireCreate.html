{% extends layout %}

{% load i18n %}
{% load crispy_forms_tags %}

{% block content %}

{% include '_includes/Messages.html' %}

<!--begin::Container-->
<div class="card">
  <!--begin::Card header-->
  <div class="card-header">
    <!--begin::Card header-->
    <div class="card-title fs-3 fw-bold">{% trans 'Nuevo Dominio de Riesgo' %}</div>
    <!--end::Card header-->
  </div>
  <!--end::Card header-->

    <form method="post" class="kt-form kt-form--label-right" novalidate>
      {% csrf_token %}
      <div class="card-body">
        <div class="row">
          <div class="col-12 col-md-6">
            <fieldset>
              <!-- <legend>{% trans 'Datos del Dominio de Riesgo' %}</legend> -->
              <div class="row mb-4">
                <div class="col-12 col-md-4 mb-4">
                  {{ form.ref|as_crispy_field }}
                </div>
              </div>
              <div class="row mb-4">
                <div class="col-12 col-md-8 mb-4">
                  {{ form.name|as_crispy_field }}
                </div>
              </div>
            </fieldset>
          </div>
        </div>
      </div>
      <!--end::Body-->

      <div class="card-footer py-6">
        <button class="btn btn-sm btn-primary"><i class="bi bi-hdd"></i> {% trans 'Guardar' %}</button>
        <a href="{% url 'questionnaires:ga_questionnaire_list' %}"
          class="btn btn-sm btn-secondary ms-2"><i class="bi bi-arrow-bar-left"></i>{% trans 'Cancelar' %}</a>
      </div>
    </form>

</div>
<!--end::Container-->

{% endblock content %}
