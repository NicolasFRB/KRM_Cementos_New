{% load i18n %}
<!--begin::Navbar-->
<div class="app-navbar flex-shrink-0">
	<!--begin::User menu-->
  <!-- <span class="fs-8 rounded bg-light px-3 py-2 position-absolute translate-middle-y top-50 end-0">
    <img class="w-15px h-15px rounded-1 ms-2" src="{% static 'media/flags/spain.svg' %}" alt="">
  </span> -->
    <!--begin::Toggle-->
    <button class="btn btn-flex btn-link rotate" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-placement="bottom-start"
      data-kt-menu-offset="0px, 0px">
      <img data-kt-element="current-lang-flag" class="w-25px h-25px rounded-circle me-3"
        src="{% static 'media/flags/spain.svg' %}" alt="">
      <span data-kt-element="current-lang-name" class="me-2">{% trans 'Español' %}</span>
      <span class="svg-icon svg-icon-3 svg-icon-muted rotate-180 m-0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M11.4343 12.7344L7.25 8.55005C6.83579 8.13583 6.16421 8.13584 5.75 8.55005C5.33579 8.96426 5.33579 9.63583 5.75 10.05L11.2929 15.5929C11.6834 15.9835 12.3166 15.9835 12.7071 15.5929L18.25 10.05C18.6642 9.63584 18.6642 8.96426 18.25 8.55005C17.8358 8.13584 17.1642 8.13584 16.75 8.55005L12.5657 12.7344C12.2533 13.0468 11.7467 13.0468 11.4343 12.7344Z"
            fill="currentColor"></path>
        </svg>
      </span>
      <!--end::Svg Icon-->
    </button>

    <div
      class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-800 menu-state-bg-light-primary fw-semibold w-200px py-4"
      data-kt-menu="true" id="kt_auth_lang_menu">
      <!--begin::Menu item-->
      <div class="menu-item px-3">
        <a href="/" class="menu-link d-flex px-5" data-kt-lang="English">
          <span class="symbol symbol-20px me-4">
            <img data-kt-element="lang-flag" class="rounded-1" src="{% static 'media/flags/spain.svg' %}" alt="">
          </span>
          <span data-kt-element="lang-name">{% trans 'Español' %}</span>
        </a>
      </div>

      <div class="menu-item px-3">
        <a href="/en/" class="menu-link d-flex px-5" data-kt-lang="Spanish">
          <span class="symbol symbol-20px me-4">
            <img data-kt-element="lang-flag" class="rounded-1" src="{% static 'media/flags/united-states.svg' %}" alt="">
          </span>
          <span data-kt-element="lang-name">{% trans 'Inglés' %}</span>
        </a>
      </div>

    </div>
	<div class="app-navbar-item ms-1 ms-lg-3" id="kt_header_user_menu_toggle">
    <a href="{% url 'auth:logout' %}" class="btn btn-sm fw-bold btn-danger px-4 pt-2 pb-2">{% trans 'Salir' %}</a>
		{% include 'partials/menus/_user-account-menu.html' %}
	</div>
	<!--end::User menu-->
	<!--begin::Header menu toggle-->
	<div class="app-navbar-item d-lg-none ms-2 me-n3" title="Show header menu">
		<div class="btn btn-icon btn-active-color-primary w-35px h-35px" id="kt_app_header_menu_toggle">{% getSvgIcon 'duotune/text/txt001.svg' 'svg-icon svg-icon-1' %}</div>
	</div>
	<!--end::Header menu toggle-->
</div>
<!--end::Navbar-->
