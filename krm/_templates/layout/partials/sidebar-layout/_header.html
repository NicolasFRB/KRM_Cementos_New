<!--begin::Header-->
<div id="kt_app_header" class="app-header">
	<!--begin::Header container-->
	<div class="app-container container-fluid d-flex align-items-stretch justify-content-between">
		<div class="d-flex align-items-center flex-grow-1 flex-lg-grow-0 me-lg-15" style="font-size:26px !important; color: #103966;">
    		<strong>{{ CONFIGURATION.app_name }}</strong>
    		<!--end::Logo-->
  		</div>
		<!--begin::sidebar mobile toggle-->
		<div class="d-flex align-items-center d-lg-none ms-n2 me-2" title="Show sidebar menu">
			<div class="btn btn-icon btn-active-color-primary w-35px h-35px" id="kt_app_sidebar_mobile_toggle">{% getSvgIcon 'duotune/abstract/abs015.svg' 'svg-icon svg-icon-1' %}</div>
		</div>
		<!--end::sidebar mobile toggle-->
		<!--begin::Mobile logo-->
		<div class="d-flex align-items-center flex-grow-1 flex-lg-grow-0">
			<a href="/" class="d-lg-none">
        {% if BRAND == 'globalvia' %}
				  <img alt="Logo" src="{% static 'media/logos/krm-logo-globalvia.svg' %}" class="h-30px" />
        {% else %}
          <img alt="Logo" src="{% static 'media/logos/krm-logo-mini.svg' %}" class="h-30px" />
        {% endif %}
			</a>
		</div>
		<!--end::Mobile logo-->
		<!--begin::Header wrapper-->
		<div class="d-flex align-items-stretch justify-content-between flex-lg-grow-1" id="kt_app_header_wrapper">
			{# include './header/_menu/_menu.html' #}
      <div></div>
			{% include './header/_navbar.html' %}
		</div>
		<!--end::Header wrapper-->
	</div>
	<!--end::Header container-->
</div>
<!--end::Header-->
